name: applicationweb
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10

  # State Management
  provider: ^6.1.5

  # Database
  postgres: ^2.5.0
  postgres_pool: ^2.0.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.1

  # API & HTTP
  http: ^1.1.0
  dio: ^5.3.2
  connectivity_plus: ^5.0.0

  # Utilities
  intl: ^0.17.0
  uuid: ^4.0.0
  crypto: ^3.0.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  injectable: ^2.1.5
  json_annotation: ^4.9.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

  # Notifications
  flutter_local_notifications: ^17.1.0

  # Environment
  flutter_dotenv: ^5.1.0

  # PDF generation / printing
  pdf: ^3.10.1
  printing: ^5.11.0

  # Form Validation
  formz: ^0.7.0

  # Logging
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  injectable_generator: ^2.3.2
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  build_runner_core: ^7.2.12

flutter:
  uses-material-design: true

  assets:
    - assets/.env

